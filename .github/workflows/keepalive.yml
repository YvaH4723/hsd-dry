# Gõ cửa Supabase 3 ngày một lần để gói miễn phí không tự tạm dừng (dừng sau 7 ngày không ai dùng).
# Chỉ đọc một dòng bằng khóa công khai; RLS chặn nên không lấy được dữ liệu, nhưng vẫn tính là có hoạt động.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: sb_publishable_AZaUVmXoX8pGMWepO98L7g_-g4Td9W0" \
            "https://xxekbzkrixiaehqxyjek.supabase.co/rest/v1/stores?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
